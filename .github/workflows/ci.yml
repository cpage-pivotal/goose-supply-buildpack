name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run complete validation suite
        run: make test package

      - name: Scan source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Resolve pinned Goose source
        id: goose
        run: |
          echo "commit=$(jq -r '.dependencies.goose.sourceCommit' config/dependencies.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Goose source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aaif-goose/goose
          ref: ${{ steps.goose.outputs.commit }}
          path: upstream-goose
          persist-credentials: false

      - name: Install Cargo Audit
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit pinned Goose Rust dependencies
        # Goose 1.52.0 still contains this reviewed advisory (rsa 0.9.10 has
        # no fixed release). Keep this list narrow so every new advisory
        # fails CI.
        # See SECURITY.md#known-upstream-goose-advisories.
        run: |
          cargo audit --file upstream-goose/Cargo.lock \
            --ignore RUSTSEC-2023-0071

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goose-supply-buildpack-validation
          path: |
            build/*.zip
            build/*.cdx.json
          if-no-files-found: warn
          retention-days: 7
